name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check and build demo APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package and verify demo APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dg-mobile-${GITHUB_REF_NAME}.apk"
          python3 - <<'PY'
          import os
          import zipfile

          path = f"dist/dg-mobile-{os.environ['GITHUB_REF_NAME']}.apk"
          assert os.path.getsize(path) > 0, "APK is empty"
          with zipfile.ZipFile(path) as apk:
              assert apk.testzip() is None, "Corrupt APK"
              assert {"AndroidManifest.xml", "classes.dex", "resources.arsc"} <= set(apk.namelist()), "Missing APK entries"
          PY
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "dist/dg-mobile-${GITHUB_REF_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(jq -r .tag .release/context.json)" = "$GITHUB_REF_NAME"
          flags=(--draft --latest=false)
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag "${flags[@]}" --title "dg-mobile $GITHUB_REF_NAME" --notes-file .release/notes.md
