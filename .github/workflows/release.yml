name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check and build demo APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Package and verify demo APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/dg-mobile-${GITHUB_REF_NAME}.apk"
          python3 - <<'PY'
          import os
          import zipfile

          path = f"dist/dg-mobile-{os.environ['GITHUB_REF_NAME']}.apk"
          assert os.path.getsize(path) > 0, "APK is empty"
          with zipfile.ZipFile(path) as apk:
              assert apk.testzip() is None, "Corrupt APK"
              assert {"AndroidManifest.xml", "classes.dex", "resources.arsc"} <= set(apk.namelist()), "Missing APK entries"
          PY
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "dist/dg-mobile-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-payloads
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  promote:
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Promote approved RC bytes (never build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/promote.py
